schema_version: 1

handle_kinds:
  - ScopeHandle
  - AliasHandle
  - RuleHandle
  - ArtifactHandle
  - EmptyHandle

obligation_defaults:
  BOUNDARY: auto_close_boundary

defaults:
  arity_req: 1
  arity_opt: 0
  distinct_required: false
  distinct_optional: false
  reflexive_ok: true
  operand_kinds:
    required: ["any"]
    optional: []
  obligations:
    opens: []
    closes: []
  phase_writes:
    select: ["registers"]
    bound: ["envelope"]
    seal: ["stack", "residue"]
  compatibility_tags: []
  tests: []

letters:
  "א": { status: implemented, arity_req: 1 }
  "ב": { status: implemented }
  "ג": { status: implemented, arity_req: 3 }
  "ד":
    status: implemented
    graph:
      - "head_of(head, source)"
      - "cont(source, head)"
      - "carry(source, head)"
      - "supp(head, source)"
    focus:
      behavior: advances
      effect: "F := head"
  "ה":
    status: implemented
    graph:
      - "head_of(head, source)"
      - "cont(source, head)"
      - "carry(source, head)"
      - "supp(head, source)"
      - "cont(head, leg)"
      - "carry(head, leg)"
      - "supp(leg, head)"
      - "sub(head, leg)"
    focus:
      behavior: advances
      effect: "F := head"
    export:
      handle: leg
      destination: head
  "ו":
    status: implemented
    arity_req: 1
    graph:
      - "cont(focus, child)"
    focus:
      behavior: advances
      effect: "F := child"
  "ז":
    status: implemented
    graph:
      - "cont(focus, port)"
      - "carry(focus, port)"
      - "supp(port, focus)"
    focus:
      behavior: stays
      effect: "F unchanged"
    export:
      handle: port
      destination: K
    policy: framed_lock
  "ח": { status: implemented }
  "ט":
    status: implemented
    arity_req: 1
    graph: []
    focus:
      behavior: advances
      effect: "F := port"
    envelope:
      effect: inward_only_with_single_sanctioned_port
  "י": { status: implemented }
  "כ":
    status: implemented
    graph:
      - "cont(focus, hold)"
      - "carry(focus, hold)"
      - "supp(hold, focus)"
    focus:
      behavior: advances
      effect: "F := hold"
  "ך":
    status: implemented
    graph:
      - "cont(focus, hold)"
      - "carry(focus, hold)"
      - "supp(hold, focus)"
    focus:
      behavior: advances
      effect: "F := hold"
    policy: final
  "ל":
    status: implemented
    graph:
      - "cont(focus, hold)"
      - "carry(focus, hold)"
      - "supp(hold, focus)"
      - "cont(hold, exterior)"
    focus:
      behavior: advances
      effect: "F := exterior"
  "מ":
    status: implemented
    graph:
      - "cont(focus, hold)"
      - "carry(focus, hold)"
      - "supp(hold, focus)"
      - "cont(hold, interior)"
    focus:
      behavior: advances
      effect: "F := interior"
    boundary_record:
      kind: mem_enclosure
      inside: interior
      outside: hold
      open: true
      closed: false
  "ם":
    status: implemented
    graph:
      - "cont(focus, sealed)"
      - "carry(focus, sealed)"
      - "supp(sealed, focus)"
    focus:
      behavior: advances
      effect: "F := sealed"
    boundary_record:
      action: close_nearest_open_mem_enclosure
      synthesize_open_if_missing: true
  "נ":
    status: implemented
    graph:
      - "cont(focus, child)"
      - "carry(focus, child)"
    focus:
      behavior: advances
      effect: "F := child"
    carry:
      resolution: unresolved
  "ן":
    status: implemented
    graph:
      - "cont(focus, child)"
      - "carry(focus, child)"
      - "supp(child, focus)"
    focus:
      behavior: advances
      effect: "F := child"
    carry:
      resolution: resolved
    policy: framed_lock
  "ס":
    id: SAMEKH
    status: implemented
    graph_if_match:
      - "supp(focus, origin)"
    graph_if_no_match: []
    focus:
      behavior: stays
      effect: "F unchanged"
  "ע":
    status: implemented
    arity_req: 1
    arity_opt: 0
    graph:
      - "cont(origin, child)"
      - "carry(origin, child)"
    focus:
      behavior: advances
      effect: "F := child"
    export:
      handle: origin
      destination: K
      handle_kind: alias
      graph_edge: none
    carry:
      resolution: unresolved
      supp_edge: false
  "פ": { status: implemented, arity_req: 2, arity_opt: 1 }
  "ף": { status: implemented }
  "צ": { status: implemented, arity_req: 2 }
  "ץ": { status: implemented, arity_req: 2 }
  "ק":
    status: implemented
    arity_req: 1
    graph:
      - "head_of(head, source)"
      - "cont(source, head)"
      - "carry(source, head)"
      - "cont(head, leg)"
      - "carry(head, leg)"
      - "sub(head, leg)"
    focus:
      behavior: advances
      effect: "F := head"
    export:
      handle: leg
      destination: head
    carry:
      resolution: unresolved
      supp_edge: false
  "ר":
    status: implemented
    graph:
      - "head_of(head, source)"
      - "cont(source, head)"
      - "carry(source, head)"
    focus:
      behavior: advances
      effect: "F := head"
  "ש":
    id: SHIN_BASE
    status: implemented
    role: fork_chassis
    arity_req: 1
    graph:
      external:
        - "cont(focus, p1)"
        - "cont(focus, p2)"
        - "cont(focus, p3)"
      internal:
        - "sub(focus, c1)"
        - "sub(focus, c2)"
        - "sub(focus, c3)"
        - "sub(c1, c2)"
        - "sub(c2, c3)"
        - "sub(c3, c1)"
    focus:
      behavior: stays
      effect: "F unchanged"
  "שׁ":
    alias_of: "ש"
    status: implemented
    diacritic: shin_dot_right
    routing:
      shin_direction: external
  "שׂ":
    alias_of: "ש"
    status: implemented
    diacritic: sin_dot_left
    routing:
      shin_direction: internal
  "ת": { status: implemented }
